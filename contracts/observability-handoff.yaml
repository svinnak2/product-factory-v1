# Purpose: Product Factory handoff contract to canonical `observability-reliability-factory` for the observability concern.
schema_version: '1.0'
contract:
  id: product-factory-to-observability-reliability-factory-observability
  source: product-factory
  target: observability-reliability-factory
required_fields:
- product_id
- initiative_id
- critical_workflows
- kpis
- product_events
- auditability_requirements
- operational_requirements
validation:
  reject_if:
  - missing_required_information
  - unresolved_critical_product_decision
  - unowned_blocking_assumption
