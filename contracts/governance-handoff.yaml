# Purpose: Product Factory handoff contract to canonical `governance-compliance-factory` for the governance concern.
schema_version: '1.0'
contract:
  id: product-factory-to-governance-compliance-factory-governance
  source: product-factory
  target: governance-compliance-factory
required_fields:
- product_id
- initiative_id
- policy_impacts
- compliance_impacts
- ai_governance_impacts
- risk_or_exception_decisions
validation:
  reject_if:
  - missing_required_information
  - unresolved_critical_product_decision
  - unowned_blocking_assumption
