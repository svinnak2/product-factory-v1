# Purpose: Product Factory handoff contract to canonical `data-factory` for the data concern.
schema_version: '1.0'
contract:
  id: product-factory-to-data-factory-data
  source: product-factory
  target: data-factory
required_fields:
- product_id
- initiative_id
- data_objects
- data_requirements
- access_intent
- retention_or_quality_needs
validation:
  reject_if:
  - missing_required_information
  - unresolved_critical_product_decision
  - unowned_blocking_assumption
